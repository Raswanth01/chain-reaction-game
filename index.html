<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chain Reactor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <div id="game-timer">Total Time: 05:00</div>
            <div id="turn-timer">Turn Time: 15</div>
            <div id="score-board">Player 1: 0 | Player 2: 0</div>
        </header>

        <!-- This is where our 6x12 grid will be generated by JavaScript later -->
        <div id="grid"></div>

        <div id="controls">
            <button id="pause-btn">Pause</button>
            <button id="reset-btn">Reset</button>
        </div>
    </div>

    <!-- Linking your logic files (we will create these next) -->
    <script src="state_manager.js"></script>
    <script src="game_engine.js"></script>
    <script src="ui_controller.js"></script>
    <script src="event_handler.js"></script>
</body>
</html>
