<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chain Reactor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-menu" class="screen">
        <h1 class="neon-title">CHAIN REACTOR</h1>
        <div class="menu-box">
            <button class="menu-btn" onclick="startGame('normal')">NORMAL MODE</button>
            <button class="menu-btn hacker-btn" onclick="startGame('hacker')">HACKER MODE</button>
        </div>
    </div>

    <div id="game-screen" class="screen hidden">
        <div id="game-container">
            <header>
                <button id="back-to-menu">← Menu</button>
                <div id="game-timer">Total Time: 03:00</div>
                <div id="turn-timer">Turn Time: 15</div>
                <div id="score-board">P1: 0 | P2: 0</div>
            </header>

            <div id="grid"></div>

            <div id="controls">
                <button id="pause-btn">Pause</button>
                <button id="reset-btn">Reset</button>
            </div>
        </div>
    </div>

    <script src="state_manager.js"></script>
    <script src="ui_controller.js"></script>
    <script src="game_engine.js"></script>
    <script src="event_handler.js"></script>
</body>
</html>
